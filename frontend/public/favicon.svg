<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner glow border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.4" />

  <!-- ChatFlow Chat Bubble Icon -->
  <g transform="translate(100, 100) scale(0.61)">
    <!-- Main Chat Shape -->
    <path d="M 256 32 C 141.1 32 48 117.9 48 224 C 48 266.3 62.4 305.5 86.8 337.5 L 56 448 L 172.5 413.5 C 198.4 423.8 226.7 429.3 256 429.3 C 370.9 429.3 464 343.4 464 237.3 C 464 131.2 370.9 32 256 32 Z" 
          fill="url(#bubbleGrad)" 
          filter="url(#shadow)" />
    
    <!-- Flow Wave Lines inside bubble -->
    <path d="M 160 180 Q 210 140 260 180 T 360 180" fill="none" stroke="#059669" stroke-width="24" stroke-linecap="round" />
    <path d="M 160 240 Q 210 200 260 240 T 360 240" fill="none" stroke="#10b981" stroke-width="24" stroke-linecap="round" />
    <path d="M 160 300 Q 210 260 260 300 T 310 300" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" />
  </g>
</svg>
